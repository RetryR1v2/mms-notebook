<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="utf-8">
        <title>mms-notebook</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>
        <div id="container">
            <h1 data-i18n="notebook_title">Notizbuch</h1>
                
            <button id="buttonPage2" data-i18n="my_messages"></button>
            <input type="text" id="inputTitle" placeholder="Titel eingeben..."data-i18n-placeholder="main_page_placeholder_input"></input>
            <textarea name="nachricht" id="inputMessage" rows="10" cols="50" placeholder="Nachricht eingeben..." data-i18n-placeholder="main_page_placeholder_textarea"></textarea>
            <button id="buttonReset" data-i18n="main_page_reset_button"></button>
            <button id="buttonSend" data-i18n="main_page_save_message"></button>
            <button id="buttonClose" data-i18n="main_page_close_button"></button>
            <div id="statusText"></div>
        </div>
        <div id="container2">
            <h2 data-i18n="my_messages_title"></h2>
            <div id="nachrichtenContainer"></div>
            <button id="buttonPage1" data-i18n="main_page_back_button"></button>
            <button id="buttonClose2" data-i18n="main_page_close_button"></button>
        </div>
        <div id="container3">
            
        </div>
        <div id="container4">
            
        </div>
        <div id="container5">

        </div>
        <script src="script.js"></script>
    </body>

</html>
