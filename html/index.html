<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="utf-8">
        <title>mms-notebook</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>
        <div id="container">
            <h1>Notizbuch</h1>
                
            <button id="buttonPage2">Meine Einträge</button>
            <input type="text" id="inputTitle" placeholder="Titel eingeben...">
            <textarea name="nachricht" id="inputMessage" rows="10" cols="50" placeholder="Nachricht eingeben..."></textarea>
            <button id="buttonReset">Zurücksetzen</button>
            <button id="buttonSend">Eintrag Speichern</button>
            <button id="buttonClose">Schließen</button>
            <div id="statusText"></div>
        </div>
        <div id="container2">
            <h2>Meine Nachrichten</h2>
            <div id="nachrichtenContainer"></div>
            <button id="buttonPage1">Zurück</button>
            <button id="buttonClose2">Schließen</button>
        </div>
        <div id="container3">
            
        </div>
        <div id="container4">
            
        </div>
        <script src="script.js"></script>
    </body>

</html>
